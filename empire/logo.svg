<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Logo Empire IDF : skyline d'Île-de-France dont la plus haute tour est une broche de grec, clin d'œil au « 129 ». -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f4a"/>
      <stop offset="1" stop-color="#123f2b"/>
    </linearGradient>
    <linearGradient id="meat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a4a1c"/>
      <stop offset=".5" stop-color="#d9822b"/>
      <stop offset="1" stop-color="#8a3f16"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- immeubles -->
  <g fill="#0c2a1d">
    <rect x="14" y="70" width="16" height="40" rx="2"/>
    <rect x="32" y="58" width="14" height="52" rx="2"/>
    <rect x="82" y="62" width="14" height="48" rx="2"/>
    <rect x="98" y="74" width="16" height="36" rx="2"/>
  </g>
  <g fill="#f2c14e" opacity=".85">
    <rect x="18" y="76" width="3" height="3"/><rect x="24" y="76" width="3" height="3"/>
    <rect x="18" y="84" width="3" height="3"/><rect x="36" y="64" width="3" height="3"/>
    <rect x="41" y="72" width="3" height="3"/><rect x="86" y="68" width="3" height="3"/>
    <rect x="91" y="78" width="3" height="3"/><rect x="102" y="80" width="3" height="3"/>
  </g>
  <!-- broche de grec (la tour centrale) -->
  <rect x="62.5" y="14" width="3" height="98" rx="1.5" fill="#cfd4dc"/>
  <path d="M50 30 Q64 24 78 30 L74 92 Q64 97 54 92 Z" fill="url(#meat)"/>
  <g stroke="#6e2f10" stroke-width="2" opacity=".55" fill="none">
    <path d="M51.5 42 Q64 38 76.5 42"/>
    <path d="M52.5 56 Q64 52 75.5 56"/>
    <path d="M53.5 70 Q64 66 74.5 70"/>
    <path d="M54 84 Q64 80 74 84"/>
  </g>
  <circle cx="64" cy="14" r="4" fill="#f2c14e"/>
  <!-- sol + 129 -->
  <rect x="10" y="110" width="108" height="4" rx="2" fill="#f2c14e"/>
  <rect x="84" y="18" width="34" height="18" rx="9" fill="#f2c14e"/>
  <text x="101" y="31.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#123f2b">129</text>
</svg>
